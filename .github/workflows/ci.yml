name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Shell (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Bash syntax check
        run: |
          for f in install.sh install-macos.sh bin/legal-workstation lib/*.sh tests/*.sh; do
            bash -n "$f" && echo "OK  $f" || { echo "FAIL $f"; exit 1; }
          done

      - name: ShellCheck (errors are blocking)
        run: |
          shellcheck --severity=error \
            install.sh install-macos.sh lib/*.sh bin/legal-workstation tests/*.sh

      - name: Bootstrap smoke test (authoritative for 'curl | bash')
        run: bash tests/test-bootstrap-smoke.sh

      - name: ~/.local/bin PATH integration test
        run: bash tests/test-local-bin-path.sh

      - name: Install manifest test
        run: bash tests/test-manifest.sh

      - name: Fresh-system manifest bootstrap test
        run: bash tests/test-manifest-bootstrap.sh

      - name: Safe uninstall test
        run: bash tests/test-uninstall-safe.sh

      - name: Complete uninstall (--all) test
        run: bash tests/test-uninstall-all.sh

  powershell:
    name: PowerShell (parser)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse check (install.ps1, CLI)
        shell: pwsh
        run: |
          $files = @('install.ps1', 'bin/legal-workstation.ps1', 'lib/manifest.ps1')
          $failed = $false
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "FAIL $f"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "OK  $f"
            }
          }
          if ($failed) { exit 1 }

      - name: Wiring assertions (recording + docs)
        shell: pwsh
        run: |
          $installText = Get-Content -Raw install.ps1
          foreach ($needle in @('Initialize-LwManifest', 'Add-LwManifestService', 'Add-LwManifestCreatedPath', 'Install-LwMsi', 'Get-LwManifestDir')) {
            if ($installText -notmatch [regex]::Escape($needle)) { Write-Host "FAIL install.ps1 eksik: $needle"; exit 1 }
          }
          $cliText = Get-Content -Raw bin/legal-workstation.ps1
          if ($cliText -notmatch [regex]::Escape('Install-LwMsi')) { Write-Host 'FAIL CLI eksik: Install-LwMsi'; exit 1 }
          if ($cliText -match 'Start-Process msiexec\.exe') { Write-Host 'FAIL CLI MSI kurulumu manifest kaydi disinda'; exit 1 }
          if ($installText -notmatch [regex]::Escape('Add-LwManifestCreatedPath')) { Write-Host 'FAIL install.ps1 sahiplenme korumasi yok'; exit 1 }
          if ((Get-Content -Raw README.md) -notmatch [regex]::Escape('manifest yoktur')) { Write-Host 'FAIL README eski kurulum notu yok'; exit 1 }
          if ((Get-Content -Raw CHANGELOG.md) -notmatch [regex]::Escape('no back-fill')) { Write-Host 'FAIL CHANGELOG eski kurulum notu yok'; exit 1 }
          Write-Host 'OK  wiring assertions'

      - name: Windows uninstall behavior tests (PowerShell 7)
        shell: pwsh
        run: |
          $env:LW_REPO_ROOT = $PWD
          $env:LW_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'lwtest'
          New-Item -ItemType Directory -Path $env:LW_TEST_ROOT -Force | Out-Null
          $files = @(
            'tests/windows/manifest.tests.ps1',
            'tests/windows/cli.tests.ps1',
            'tests/windows/uninstall.tests.ps1',
            'tests/windows/install-bootstrap.tests.ps1',
            'tests/windows/install-record.tests.ps1',
            'tests/windows/service-revert.tests.ps1',
            'tests/windows/uninstall-nolib.tests.ps1'
          )
          foreach ($f in $files) {
            Write-Host "==> $f"
            & pwsh -NoProfile -File $f
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $env:LW_REPO_ROOT = $PWD
          $env:LW_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'lwtest51'
          New-Item -ItemType Directory -Path $env:LW_TEST_ROOT -Force | Out-Null
          $files = @(
            'tests/windows/cli.tests.ps1',
            'tests/windows/install-bootstrap.tests.ps1',
            'tests/windows/install-record.tests.ps1',
            'tests/windows/service-revert.tests.ps1',
            'tests/windows/uninstall-nolib.tests.ps1'
          )
          $failed = $false
          foreach ($f in $files) {
            Write-Host "==> $f (5.1)"
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $f
            if ($LASTEXITCODE) { $failed = $true; Write-Host "FAIL $f" } else { Write-Host "OK  $f" }
          }
          if ($failed) { exit 1 }
